name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version: ${{vars.NODE_VERSION}}
      - name: Install pinned tree-sitter CLI
        shell: bash
        run: |-
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild tree-sitter-cli
      - name: Set up examples
        shell: bash
        run: |-
          checkout_example() {
            repository=$1
            destination=$2
            revision=$3
            git init "$destination"
            git -C "$destination" remote add origin "https://github.com/$repository"
            git -C "$destination" fetch --depth=1 --filter=blob:none origin "$revision"
            git -C "$destination" checkout --detach FETCH_HEAD
          }
          checkout_example JamesNK/Newtonsoft.Json examples/Newtonsoft.Json 4f73e74372445108d2c1bda37b36e6f5e43402e0
          checkout_example nunit/nunit examples/nunit 4c7f0eac462327a6b4084e5f0baa3ab32494185c
          checkout_example OrchardCMS/orchard examples/orchard a619b708c8bdd354ed7648c992fce1a0c482565e
          checkout_example microsoft/PowerToys examples/PowerToys ff87dce4a411e82312089cd6a360b910c8211c4b
      - name: Verify generated parser
        shell: bash
        run: |-
          npx tree-sitter generate
          git diff --exit-code -- src
      - name: Run parser tests
        run: npx tree-sitter test
      - name: Run Rust tests
        run: cargo test --locked
      - name: Parse examples
        shell: bash
        run: |-
          find examples -type f -name '*.cs' | sort > example-files-all.txt
          grep -Fvx -f .github/example-exclusions.txt example-files-all.txt > example-files.txt
          npx tree-sitter parse --paths example-files.txt --quiet
