name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version: ${{vars.NODE_VERSION}}
      - name: Install pinned tree-sitter CLI
        shell: bash
        run: |-
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild tree-sitter-cli
      - name: Set up examples
        run: |-
          git clone https://github.com/JamesNK/Newtonsoft.Json examples/Newtonsoft.Json --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/nunit/nunit examples/nunit --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/OrchardCMS/orchard examples/orchard --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/microsoft/PowerToys examples/PowerToys --single-branch --depth=1 --filter=blob:none
      - name: Verify generated parser
        shell: bash
        run: |-
          npx tree-sitter generate
          git diff --exit-code -- src
      - name: Run parser tests
        run: npx tree-sitter test
      - name: Run Rust tests
        run: cargo test --locked
      - name: Parse examples
        shell: bash
        run: |-
          find examples -type f -name '*.cs' | sort > example-files-all.txt
          grep -Fvx -f .github/example-exclusions.txt example-files-all.txt > example-files.txt
          npx tree-sitter parse --paths example-files.txt --quiet
